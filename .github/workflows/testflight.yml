name: macOS Release and TestFlight

on:
  push:
    branches:
      - testflight
      - main
  workflow_dispatch:

concurrency:
  group: testflight-nautica-${{ github.ref }}
  cancel-in-progress: true

jobs:
  distribute:
    name: Build macOS Release Package
    runs-on: macos-15
    timeout-minutes: 60
    permissions:
      contents: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Build Nautica for macOS
        run: |
          mkdir -p build/macOS
          set -o pipefail
          xcodebuild \
            -project Nautica.xcodeproj \
            -scheme Nautica \
            -configuration Release \
            -destination "generic/platform=macOS" \
            -derivedDataPath "$RUNNER_TEMP/Nautica-Build" \
            ARCHS=arm64 \
            ONLY_ACTIVE_ARCH=NO \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="-" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=YES \
            build 2>&1 | tee xcodebuild.log || {
              echo "=== XCODEBUILD NAUTICA FAILED ==="
              tail -n 120 xcodebuild.log
              exit 1
            }

      - name: Package macOS App for Distribution
        run: |
          set -e
          mkdir -p build/macOS
          APP_PATH=$(find "$RUNNER_TEMP/Nautica-Build" -name "Nautica.app" -type d | head -n 1)
          echo "Found Nautica.app at: $APP_PATH"
          if [ ! -d "$APP_PATH" ]; then
            echo "Error: Nautica.app was not found!"
            find "$RUNNER_TEMP/Nautica-Build" -maxdepth 5 || true
            exit 1
          fi
          cd "$(dirname "$APP_PATH")"
          zip -qr "$GITHUB_WORKSPACE/build/macOS/Nautica-macOS-arm64.zip" Nautica.app
          cd "$GITHUB_WORKSPACE"
          ls -lh build/macOS/Nautica-macOS-arm64.zip
          echo "Generated Nautica-macOS-arm64.zip size: $(ls -lh build/macOS/Nautica-macOS-arm64.zip | awk '{print $5}')"

      - name: Save Binary to GitHub Artifacts (Downloadable App)
        uses: actions/upload-artifact@v4
        with:
          name: Nautica-macOS-Package
          path: build/macOS/Nautica-macOS-arm64.zip

      - name: Upload Build Log Artifact (Diagnostic)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Nautica-Build-Log
          path: xcodebuild.log

      - name: Publish Diagnostic Log to Diagnostics Branch
        if: always()
        run: |
          if [ -f xcodebuild.log ]; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git checkout -B diagnostics
            cp xcodebuild.log diagnostic_xcodebuild.log
            git add diagnostic_xcodebuild.log
            git commit -m "ci: update diagnostic xcodebuild log [skip ci]" || true
            git push -f origin diagnostics || true
          fi
